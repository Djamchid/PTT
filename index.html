<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Prends Ton Temps - Mini-jeu de stimulation cognitive">
    <title>Prends Ton Temps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===== ÉCRAN A: BRIEFING ===== -->
    <div id="screen-briefing" class="screen active">
        <div class="screen-header">
            <h1>Prends Ton Temps</h1>
        </div>
        <div class="screen-body">
            <div class="rule-card">
                <h2 id="briefing-rule">Chargement...</h2>
            </div>
            <p class="text-center" style="color: #666;">Quand tu veux.</p>
        </div>
        <div class="screen-footer">
            <button id="btn-ready" class="btn btn-primary" style="width: 100%;">Je suis prêt</button>
        </div>
    </div>

    <!-- ===== ÉCRAN B: JEU ===== -->
    <div id="screen-game" class="screen">
        <button id="btn-pause" class="btn btn-icon" title="Pause">⏸</button>

        <div class="screen-header">
            <div id="game-rule-banner" class="rule-banner">Règle...</div>
        </div>

        <div class="screen-body">
            <div class="stimulus-container">
                <div id="stimulus" class="stimulus"></div>
            </div>
        </div>

        <div class="screen-footer">
            <div class="response-buttons">
                <button id="btn-yes" class="btn btn-yes">OUI</button>
                <button id="btn-no" class="btn btn-no">NON</button>
            </div>
        </div>
    </div>

    <!-- ===== ÉCRAN C: RÉSUMÉ ===== -->
    <div id="screen-summary" class="screen">
        <div class="screen-header">
            <h1>Merci. À bientôt.</h1>
            <p id="session-count" style="color: #888; font-size: 14px; margin-top: 8px;"></p>
        </div>
        <div class="screen-body">
            <div class="summary-grid">
                <div class="metric-card">
                    <div class="metric-label">Stabilité</div>
                    <div id="metric-stability" class="metric-value">-</div>
                    <div class="metric-description">Régularité des réponses</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Flexibilité</div>
                    <div id="metric-flexibility" class="metric-value">-</div>
                    <div class="metric-description">Adaptation aux changements</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Régularité</div>
                    <div id="metric-regularity" class="metric-value">-</div>
                    <div class="metric-description">Constance globale</div>
                </div>
            </div>
        </div>
        <div class="screen-footer">
            <div class="action-buttons">
                <button id="btn-replay" class="btn btn-primary">Rejouer</button>
                <button id="btn-export-json" class="btn btn-secondary">Exporter cette session (JSON)</button>
                <button id="btn-export-csv" class="btn btn-secondary">Exporter cette session (CSV)</button>
            </div>
            <div class="action-buttons" style="margin-top: 12px;">
                <button id="btn-export-all" class="btn btn-secondary">Exporter toutes les sessions</button>
                <button id="btn-delete-last" class="btn btn-secondary" style="background: #ff6b6b;">Supprimer dernière session</button>
                <button id="btn-delete-all" class="btn btn-secondary" style="background: #d63031;">Supprimer toutes les sessions</button>
            </div>
        </div>
    </div>

    <!-- ===== FEEDBACK ===== -->
    <div id="feedback" class="feedback"></div>

    <!-- ===== DEBUG INFO ===== -->
    <div class="debug-info" id="debug-info"></div>

    <script src="app.js"></script>
</body>
</html>
